services:
  mysql:
    image: mysql:8.0
    container_name: garoua_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: garoua_explorer
      MYSQL_USER: garoua_user
      MYSQL_PASSWORD: garoua_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garoua_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "mysql://garoua_user:garoua_pass@mysql:3306/garoua_explorer"
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
